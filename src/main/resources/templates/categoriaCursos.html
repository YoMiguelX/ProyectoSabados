<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Encabezado -->
</header>
<nav>
    <!-- Versión móvil -->
    <div class="mobile">
        <div class="header">
            <button id="bmenu"><i class="fa-solid fa-list"></i></button>
            <a th:href="@{/}">
                <img th:src="@{/IMG/Shenmy Kappai.png}" width="60" alt="Logo" />
            </a>
            <div>
                <a th:href="@{/login}"><i class="fa-solid fa-user"></i></a>
                <a href="#"><i class="fa-solid fa-cart-shopping"></i></a>
            </div>
        </div>
        <div class="links">
            <a href="#">Juegos</a>
            <a th:href="@{/soporte}">Soporte</a>
        </div>
    </div>

    <!-- Navegación escritorio -->
    <ul>
        <li>
            <img th:src="@{/IMG/Shenmy Kappai.png}" width="60" alt="Shenmy Kappai">
        </li>
        <li><a href="#" class="link link-hide">Juegos</a></li>
        <li><a th:href="@{/soporte}" class="link link-hide">Soporte técnico</a></li>
        <li class="more">
            <a href="#" class="link" id="bmore">Menú</a>
            <div class="menu">
                <a th:href="@{/soporte}">Soporte técnico</a>
            </div>
        </li>
    </ul>

    <!-- Íconos extras -->
    <ul>
        <li><a href="#" class="link"><i class="fa-solid fa-search"></i></a></li>
        <li><a href="#" class="link"><i class="fa-solid fa-cart-shopping"></i></a></li>
        <li><a th:href="@{/perfil}" class="link">Perfil</a></li>
    </ul>
</nav>
</header>


<!-- Filtro por mundos -->
<nav class="bg-white border-b border-gray-200 px-8 py-4">
    <form method="get" action="/categoria-cursos" class="flex items-center gap-4">
        <label class="text-sm font-medium text-gray-700">Filtrar por mundo:</label>
        <select name="mundo" class="border rounded px-3 py-2 text-sm">
            <option value="">Todos los mundos</option>
            <option th:each="mundo : ${mundos}"
                    th:value="${mundo.nombre}"
                    th:text="${mundo.nombre}"
                    th:selected="${param.mundo == mundo.nombre}">
            </option>
        </select>
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">
            Filtrar
        </button>
    </form>
</nav>

<!-- Grid de cursos -->
<main class="p-8">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">

        <!-- Curso: Comprar Casa -->
        <button class="bg-white border border-gray-200 p-4 rounded hover:shadow transition"
                onclick="window.location.href='/curso/comprar-casa'">
            <p class="text-xs text-gray-500 mb-1">Finanzas personales</p>
            <h2 class="font-bold text-lg mb-2">Compra tu casa</h2>
            <div class="text-right text-blue-600 text-xl">→</div>
        </button>

        <!-- Curso: Física -->

    </div>
</main>

</body>
</html>
