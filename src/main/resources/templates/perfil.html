<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" th:href="@{/CSS/perfil.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-gray-100">
<div th:replace="~{plantilla/navbar :: navbar}"></div>

<div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-md">
        <div class="p-4 text-center">
            <!-- Avatar -->
            <img id="avatarSidebar" class="w-24 h-24 rounded-full mx-auto mb-2"
                 src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="avatar">
            <button type="button" class="text-blue-500"><i class="fas fa-camera"></i></button>
            <h3 class="font-bold text-lg" th:text="${usuario.nombreUsuario} ?: 'Usuario'">Usuario</h3>
            <p class="text-sm text-gray-500" th:text="${usuario.correoUsuario} ?: 'correo@ejemplo.com'">correo@ejemplo.com</p>
            <span class="text-green-500 text-sm"><i class="fas fa-check-circle"></i> Cuenta Activa</span>

            <!-- Navegación -->
            <nav class="mt-6 text-left">
                <h4 class="font-semibold mb-2">Cuenta</h4>
                <ul>
                    <li class="py-2 px-2 cursor-pointer hover:bg-gray-200" onclick="mostrarSeccion('informacion')">
                        <i class="fas fa-user-circle"></i> Tu información
                    </li>
                    <li class="py-2 px-2 cursor-pointer hover:bg-gray-200" onclick="mostrarSeccion('seguridad')">
                        <i class="fas fa-shield-alt"></i> Seguridad
                    </li>
                </ul>
                <h4 class="font-semibold mt-4 mb-2">Red Amigos</h4>
                <ul>
                    <li class="py-2 px-2 cursor-pointer hover:bg-gray-200" onclick="mostrarSeccion('perfil')">
                        <i class="fas fa-id-card"></i> Perfil
                    </li>
                    <li class="py-2 px-2 cursor-pointer hover:bg-gray-200" onclick="mostrarSeccion('privacidad')">
                        <i class="fas fa-lock"></i> Privacidad
                    </li>
                    <li class="py-2 px-2 cursor-pointer hover:bg-gray-200" onclick="mostrarSeccion('familia')">
                        <i class="fas fa-users"></i> Familia
                    </li>
                    <li class="py-2 px-2 cursor-pointer hover:bg-gray-200" onclick="mostrarSeccion('reporte')">
                        <i class="fas fa-flag"></i> Reportes
                    </li>
                </ul>
            </nav>

            <a th:href="@{/logout}" class="flex items-center mt-6 text-red-500 hover:text-red-700">
                <i class="fas fa-sign-out-alt mr-2"></i> Cerrar sesión
            </a>
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 p-6">
        <!-- Sección: Tu Información -->
        <section id="informacion" class="seccion">
            <div class="bg-white p-6 rounded shadow-md mb-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-xl">Tu información</h2>
                    <button id="btnEditarInfo" type="button" class="btn btn-primary flex items-center" onclick="toggleEditarInfo()">
                        <i class="fas fa-edit mr-2"></i> Editar
                    </button>
                </div>

                <form th:action="@{/usuario/actualizar-info}" method="post" id="formActualizarInfo">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Nombre -->
                        <div>
                            <label class="font-semibold">Nombre</label>
                            <div id="displayNombre" th:text="${usuario.nombreUsuario} ?: 'Nombre'">Nombre</div>
                            <input type="text" name="nombreUsuario" id="inputNombre"
                                   th:value="${usuario.nombreUsuario}" class="hidden border rounded w-full p-2" required>
                        </div>
                        <!-- Apellido -->
                        <div>
                            <label class="font-semibold">Apellido</label>
                            <div id="displayApellido" th:text="${usuario.apellidoUsuario} ?: 'Apellido'">Apellido</div>
                            <input type="text" name="apellidoUsuario" id="inputApellido"
                                   th:value="${usuario.apellidoUsuario}" class="hidden border rounded w-full p-2" required>
                        </div>
                        <!-- Correo -->
                        <div>
                            <label class="font-semibold">Correo electrónico</label>
                            <div id="displayCorreo" th:text="${usuario.correoUsuario} ?: 'correo@ejemplo.com'">correo@ejemplo.com</div>
                            <input type="email" name="correoUsuario" id="inputCorreo"
                                   th:value="${usuario.correoUsuario}" class="hidden border rounded w-full p-2" required>
                        </div>
                        <!-- Teléfono -->
                        <div>
                            <label class="font-semibold">Teléfono</label>
                            <div id="displayTelefono"
                                 th:text="${usuario.telUsuario != null && !usuario.telUsuario.isEmpty() ? usuario.telUsuario : 'No registrado'}">-</div>
                            <input type="tel" name="telUsuario" id="inputTelefono"
                                   th:value="${usuario.telUsuario}" class="hidden border rounded w-full p-2"
                                   placeholder="Ingresa tu teléfono">
                        </div>
                    </div>

                    <!-- Botones -->
                    <div id="botonesAccionInfo" class="mt-4 hidden flex gap-2">
                        <button type="submit" class="btn btn-success flex items-center">
                            <i class="fas fa-save mr-2"></i> Guardar cambios
                        </button>
                        <button type="button" class="btn btn-secondary flex items-center" onclick="cancelarEditarInfo()">
                            <i class="fas fa-times mr-2"></i> Cancelar
                        </button>
                    </div>
                </form>

                <!-- Mensajes -->
                <div th:if="${mensaje != null}" class="mt-4 p-3 rounded"
                     th:classappend="${error != null} ? ' bg-red-100 text-red-700' : ' bg-green-100 text-green-700'">
                    <i th:classappend="${error != null} ? ' fas fa-exclamation-circle mr-2' : ' fas fa-check-circle mr-2'"></i>
                    <span th:text="${mensaje}"></span>
                </div>
            </div>
        </section>

        <!-- Otras secciones -->
        <section id="seguridad" class="seccion hidden">Seguridad</section>
        <section id="perfil" class="seccion hidden">Perfil</section>
        <section id="privacidad" class="seccion hidden">Privacidad</section>
        <section id="familia" class="seccion hidden">Familia</section>
        <section id="reporte" class="seccion hidden">Reportes</section>
    </main>
</div>

<!-- JS -->
<script>
    function toggleEditarInfo() {
        document.getElementById('btnEditarInfo').classList.add('hidden');
        document.getElementById('botonesAccionInfo').classList.remove('hidden');
        ['Nombre','Apellido','Correo','Telefono'].forEach(campo=>{
            document.getElementById('display'+campo).classList.add('hidden');
            document.getElementById('input'+campo).classList.remove('hidden');
        });
    }

    function cancelarEditarInfo() {
        document.getElementById('btnEditarInfo').classList.remove('hidden');
        document.getElementById('botonesAccionInfo').classList.add('hidden');
        ['Nombre','Apellido','Correo','Telefono'].forEach(campo=>{
            document.getElementById('display'+campo).classList.remove('hidden');
            document.getElementById('input'+campo).classList.add('hidden');
        });
    }

    function mostrarSeccion(seccionId) {
        document.querySelectorAll('.seccion').forEach(sec=>sec.classList.add('hidden'));
        const sec = document.getElementById(seccionId);
        if(sec) sec.classList.remove('hidden');
    }
</script>
</body>
</html>
